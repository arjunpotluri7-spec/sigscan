# Example Sigscan configuration. Pass it with:  sigscan scan --config config.example.ini PATH...
# Command-line flags override these values; `rules` and `skip` add to the command line.
# Relative paths are resolved from the current directory. No secrets belong here.

# rules = samples/rules/demo.sig
format = table
fail_on = high
max_filesize = 64MB
max_matches_per_string = 1000
max_files = 100000
threads = 4
follow_symlinks = false
show_strings = false
skip = .git
skip = node_modules
skip = **/*.iso
